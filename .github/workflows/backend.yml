name: Backend CI/CD

on:
  push:
    tags:
      - 'b*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 保留 Go 预编译以测试代码正确性
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: './backend/go.sum'

      - name: Build backend (Sanity check)
        working-directory: ./backend
        run: go build -v -o app

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lower case image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=b(.*),group=1
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cleanup-go-cache:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Keep only the latest Go dependency cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cache_ids=$(gh cache list --key "setup-go-" --limit 100 --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[1:][] | .id')

          for cache_id in $cache_ids; do
            echo "Deleting stale Go cache: $cache_id"
            gh cache delete "$cache_id"
          done
