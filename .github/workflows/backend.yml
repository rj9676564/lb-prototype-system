name: Backend CI/CD

on:
  push:
    tags:
      - 'b*.*.*'
  workflow_dispatch:
    inputs:
      force_build_frontend:
        description: '是否强制重新编译前端'
        type: boolean
        default: false
      platforms:
        description: '目标构建架构'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
        default: 'linux/amd64,linux/arm64'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 检查前端源码是否发生变动
      - name: Check frontend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

      # 2. 尝试从缓存恢复已编译的 frontend/dist
      - name: Restore frontend dist cache
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: frontend-dist-${{ hashFiles('frontend/src/**', 'frontend/package.json', 'frontend/pnpm-lock.yaml', 'frontend/package-lock.json', 'frontend/index.html', 'frontend/vite.config.ts') }}
          restore-keys: |
            frontend-dist-

      # 3. 仅在前端源码变更、缓存未命中或手动指定强制编译时才执行 Node 编译
      - name: Setup Node
        if: steps.filter.outputs.frontend == 'true' || steps.dist-cache.outputs.cache-hit != 'true' || github.event.inputs.force_build_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build frontend
        if: steps.filter.outputs.frontend == 'true' || steps.dist-cache.outputs.cache-hit != 'true' || github.event.inputs.force_build_frontend == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Ensure frontend dist directory exists
        run: mkdir -p frontend/dist

      # 4. 登录 Docker Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lower case image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=b(.*),group=1
            type=sha

      # 5. 编译 Go 并组装镜像（支持参数化多架构与缓存加速）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
